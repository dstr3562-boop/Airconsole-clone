<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trivia — Screen</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --glass-bg: rgba(255,255,255,0.10);
    --glass-bg-strong: rgba(255,255,255,0.16);
    --glass-border: rgba(255,255,255,0.35);
    --glass-highlight: rgba(255,255,255,0.55);
    --text: #f5f7ff;
    --muted: rgba(245,247,255,0.65);
    --accent: #7ee8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, #1b1035 0%, #0e1230 45%, #04070f 100%);
    position: relative;
  }

  .blob {
    position: fixed; border-radius: 50%; filter: blur(60px);
    opacity: 0.55; z-index: 0; will-change: transform;
  }
  .blob1 { width: 520px; height: 520px; background: #ff5d9e; top: -120px; left: -100px; animation: float1 22s ease-in-out infinite; }
  .blob2 { width: 460px; height: 460px; background: #4da6ff; bottom: -140px; right: -80px; animation: float2 26s ease-in-out infinite; }
  .blob3 { width: 360px; height: 360px; background: #7ee88a; top: 40%; left: 60%; animation: float3 30s ease-in-out infinite; }
  @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(80px, 60px); } }
  @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-70px, -50px); } }
  @keyframes float3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-40px, 40px) scale(1.15); } }

  .app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }

  .glass {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 26px;
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 var(--glass-highlight);
    position: relative;
    overflow: hidden;
  }
  .glass::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 40%;
    background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0));
    pointer-events: none;
  }

  h1 { font-weight: 700; font-size: 28px; letter-spacing: 0.3px; }
  .muted { color: var(--muted); }

  #lobby { display: flex; gap: 24px; width: 100%; max-width: 980px; align-items: stretch; }
  .lobby-main { flex: 1.3; padding: 32px; text-align: center; }
  .lobby-chat { flex: 1; padding: 20px; display: flex; flex-direction: column; min-height: 420px; }

  #code { font-size: 54px; font-weight: 800; letter-spacing: 10px; color: var(--accent); margin: 10px 0; text-shadow: 0 0 24px rgba(126,232,255,0.5); }
  #qrcode { margin: 14px auto; display: inline-block; padding: 10px; background: rgba(255,255,255,0.9); border-radius: 14px; }
  #players { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip { background: var(--glass-bg-strong); border: 1px solid var(--glass-border); padding: 7px 14px; border-radius: 999px; font-size: 14px; }

  #startBtn {
    margin-top: 22px; border: none; padding: 14px 34px; font-size: 17px; font-weight: 700;
    border-radius: 14px; cursor: pointer; color: #071019;
    background: linear-gradient(135deg, var(--accent), #a6ffcb);
    box-shadow: 0 6px 20px rgba(126,232,255,0.35);
  }
  #startBtn:disabled { opacity: 0.35; cursor: not-allowed; }

  .chat-title { font-size: 14px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .chat-feed { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
  .chat-msg { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 6px 10px; font-size: 14px; }
  .chat-msg b { color: var(--accent); }
  .chat-feed::-webkit-scrollbar { width: 5px; }
  .chat-feed::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 4px; }

  #game { display: none; width: 100%; max-width: 1000px; flex-direction: column; align-items: center; gap: 16px; }
  .qcard { padding: 30px 36px; width: 100%; text-align: center; }
  #qIndex { color: var(--muted); font-size: 14px; margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
  #qText { font-size: 30px; font-weight: 700; line-height: 1.3; }

  #timerTrack { width: 100%; height: 10px; border-radius: 999px; background: rgba(255,255,255,0.12); margin-top: 22px; overflow: hidden; }
  #timerBar { height: 100%; width: 100%; background: linear-gradient(90deg, var(--accent), #ff9bd2); border-radius: 999px; transition: width linear; }

  #optionsGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; margin-top: 8px; }
  .opt { padding: 20px; border-radius: 18px; font-size: 18px; font-weight: 600; text-align: left; }
  .opt.o0 { background: linear-gradient(135deg, rgba(255,93,122,0.35), rgba(255,93,122,0.15)); border-color: rgba(255,93,122,0.5); }
  .opt.o1 { background: linear-gradient(135deg, rgba(77,166,255,0.35), rgba(77,166,255,0.15)); border-color: rgba(77,166,255,0.5); }
  .opt.o2 { background: linear-gradient(135deg, rgba(255,209,102,0.35), rgba(255,209,102,0.15)); border-color: rgba(255,209,102,0.5); }
  .opt.o3 { background: linear-gradient(135deg, rgba(126,232,138,0.35), rgba(126,232,138,0.15)); border-color: rgba(126,232,138,0.5); }
  .opt .count { float: right; color: var(--muted); font-weight: 400; font-size: 14px; }
  .opt.correct { outline: 3px solid #7ee88a; }
  .opt.wrong { outline: 3px solid #ff5d7a; opacity: 0.55; }

  #board { display: none; width: 100%; max-width: 640px; padding: 30px; text-align: center; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; margin: 8px 0; border-radius: 14px; background: rgba(255,255,255,0.08); }
  .row .rank { width: 28px; font-weight: 800; color: var(--accent); }
  .row .name { flex: 1; text-align: left; margin-left: 10px; }
  .row .score { font-weight: 700; }
  #playAgain {
    margin-top: 18px; border: none; padding: 12px 28px; font-size: 15px; font-weight: 700;
    border-radius: 12px; cursor: pointer; color: #071019; background: var(--accent);
  }

  .side-chat { position: fixed; right: 24px; bottom: 24px; width: 300px; height: 260px; padding: 14px; display: none; flex-direction: column; z-index: 2; }
</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="app">

  <div id="lobby">
    <div class="glass lobby-main">
      <h1>🎉 Trivia Night</h1>
      <div class="muted" id="joinHint">Scan or type the code on your phone</div>
      <div id="code">----</div>
      <div id="qrcode"></div>
      <div id="players"></div>
      <button id="startBtn" disabled>Start Game</button>
    </div>
    <div class="glass lobby-chat">
      <div class="chat-title">💬 Chat</div>
      <div class="chat-feed" id="lobbyChatFeed"></div>
    </div>
  </div>

  <div id="game">
    <div class="glass qcard">
      <div id="qIndex">Question 1 / 10</div>
      <div id="qText">—</div>
      <div id="timerTrack"><div id="timerBar"></div></div>
    </div>
    <div id="optionsGrid">
      <div class="glass opt o0" data-i="0"><span class="label"></span><span class="count"></span></div>
      <div class="glass opt o1" data-i="1"><span class="label"></span><span class="count"></span></div>
      <div class="glass opt o2" data-i="2"><span class="label"></span><span class="count"></span></div>
      <div class="glass opt o3" data-i="3"><span class="label"></span><span class="count"></span></div>
    </div>
  </div>

  <div id="board" class="glass">
    <h1 id="boardTitle">🏆 Leaderboard</h1>
    <div id="rows"></div>
    <button id="playAgain">Play Again</button>
  </div>

</div>

<div class="glass side-chat" id="sideChat">
  <div class="chat-title">💬 Chat</div>
  <div class="chat-feed" id="sideChatFeed"></div>
</div>

<script>
const QUESTIONS = [
  { text: "Which planet is known as the Red Planet?", options: ["Venus","Mars","Jupiter","Saturn"], correct: 1 },
  { text: "What is the largest ocean on Earth?", options: ["Atlantic","Indian","Arctic","Pacific"], correct: 3 },
  { text: "How many strings does a standard guitar have?", options: ["4","5","6","7"], correct: 2 },
  { text: "Which element has the chemical symbol 'O'?", options: ["Gold","Oxygen","Osmium","Silver"], correct: 1 },
  { text: "What's the tallest land animal?", options: ["Elephant","Giraffe","Moose","Camel"], correct: 1 },
  { text: "Which country is home to the kangaroo?", options: ["South Africa","Brazil","Australia","India"], correct: 2 },
  { text: "How many continents are there?", options: ["5","6","7","8"], correct: 2 },
  { text: "What gas do plants absorb from the air?", options: ["Oxygen","Nitrogen","Carbon dioxide","Helium"], correct: 2 },
  { text: "Which shape has three sides?", options: ["Square","Triangle","Pentagon","Hexagon"], correct: 1 },
  { text: "What's the freezing point of water in °C?", options: ["0°C","10°C","-10°C","5°C"], correct: 0 },
];
const QUESTION_DURATION = 15000; // ms

const wsProtocol = location.protocol === "https:" ? "wss" : "ws";
const ws = new WebSocket(`${wsProtocol}://${location.host}`);

const el = (id) => document.getElementById(id);
const lobby = el("lobby"), gameEl = el("game"), boardEl = el("board");
const codeEl = el("code"), qrEl = el("qrcode"), playersEl = el("players"), startBtn = el("startBtn");
const qIndexEl = el("qIndex"), qTextEl = el("qText"), timerBar = el("timerBar");
const rowsEl = el("rows"), boardTitle = el("boardTitle");
const lobbyChatFeed = el("lobbyChatFeed"), sideChatFeed = el("sideChatFeed"), sideChat = el("sideChat");

let roomCode = null;
const players = {}; // id -> {name, score}
let qIdx = -1;
let phase = "lobby"; // lobby | question | reveal | final
let questionStartTime = 0;
let answered = {}; // id -> {choice, elapsed}
let timerRAF = null;

function send(obj) { ws.send(JSON.stringify(obj)); }

ws.addEventListener("open", () => send({ type: "create-room" }));

ws.addEventListener("message", (event) => {
  const msg = JSON.parse(event.data);
  switch (msg.type) {
    case "room-created": {
      roomCode = msg.code;
      codeEl.textContent = roomCode;
      const joinUrl = `${location.origin}/controller.html?code=${roomCode}`;
      qrEl.innerHTML = "";
      new QRCode(qrEl, { text: joinUrl, width: 150, height: 150 });
      break;
    }
    case "player-list": {
      playersEl.innerHTML = "";
      msg.players.forEach((p) => {
        if (!players[p.id]) players[p.id] = { name: p.name, score: 0 };
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.textContent = p.name;
        playersEl.appendChild(chip);
      });
      startBtn.disabled = msg.players.length === 0;
      break;
    }
    case "player-left": delete players[msg.playerId]; break;

    case "input": {
      const data = msg.data;
      if (data.kind === "chat") {
        const p = players[msg.playerId];
        const fromName = p ? p.name : "Player";
        addChat(fromName, data.text);
        // relay to every other controller so all phones see the chat too
        send({ type: "to-all-controllers", data: { kind: "chat", from: fromName, text: data.text } });
      } else if (data.kind === "answer" && phase === "question") {
        if (answered[msg.playerId]) return;
        const elapsed = Date.now() - questionStartTime;
        answered[msg.playerId] = { choice: data.choice, elapsed };
        updateLiveCounts();
      }
      break;
    }
  }
});

function addChat(name, text) {
  const line = document.createElement("div");
  line.className = "chat-msg";
  line.innerHTML = `<b>${escapeHtml(name)}:</b> ${escapeHtml(text)}`;
  lobbyChatFeed.appendChild(line.cloneNode(true));
  sideChatFeed.appendChild(line);
  lobbyChatFeed.scrollTop = lobbyChatFeed.scrollHeight;
  sideChatFeed.scrollTop = sideChatFeed.scrollHeight;
}
function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function updateLiveCounts() {
  const counts = [0,0,0,0];
  Object.values(answered).forEach((a) => counts[a.choice]++);
  document.querySelectorAll(".opt").forEach((o, i) => {
    o.querySelector(".count").textContent = counts[i] ? counts[i] : "";
  });
}

startBtn.addEventListener("click", startGame);
el("playAgain").addEventListener("click", () => {
  Object.values(players).forEach((p) => p.score = 0);
  boardEl.style.display = "none";
  lobby.style.display = "flex";
  sideChat.style.display = "none";
  send({ type: "to-all-controllers", data: { kind: "reset" } });
});

function startGame() {
  lobby.style.display = "none";
  gameEl.style.display = "flex";
  sideChat.style.display = "flex";
  qIdx = -1;
  nextQuestion();
}

function nextQuestion() {
  qIdx++;
  if (qIdx >= QUESTIONS.length) { showFinal(); return; }
  phase = "question";
  answered = {};
  const q = QUESTIONS[qIdx];

  qIndexEl.textContent = `Question ${qIdx+1} / ${QUESTIONS.length}`;
  qTextEl.textContent = q.text;
  document.querySelectorAll(".opt").forEach((o, i) => {
    o.classList.remove("correct","wrong");
    o.querySelector(".label").textContent = q.options[i];
    o.querySelector(".count").textContent = "";
  });

  questionStartTime = Date.now();
  timerBar.style.transition = "none";
  timerBar.style.width = "100%";
  requestAnimationFrame(() => {
    timerBar.style.transition = `width ${QUESTION_DURATION}ms linear`;
    timerBar.style.width = "0%";
  });

  send({ type: "to-all-controllers", data: {
    kind: "question", index: qIdx, total: QUESTIONS.length,
    text: q.text, options: q.options, duration: QUESTION_DURATION
  }});

  clearTimeout(timerRAF);
  timerRAF = setTimeout(reveal, QUESTION_DURATION + 300);
}

function reveal() {
  phase = "reveal";
  const q = QUESTIONS[qIdx];
  document.querySelectorAll(".opt").forEach((o, i) => {
    o.classList.toggle("correct", i === q.correct);
  });

  Object.entries(players).forEach(([id, p]) => {
    const a = answered[id];
    let earned = 0;
    let correct = false;
    if (a && a.choice === q.correct) {
      correct = true;
      earned = Math.max(100, Math.round(500 + 500 * (1 - a.elapsed / QUESTION_DURATION)));
      p.score += earned;
    }
    send({ type: "to-controller", playerId: id, data: {
      kind: "reveal", correct, earned, totalScore: p.score, correctIndex: q.correct, correctText: q.options[q.correct]
    }});
  });

  updateLiveCounts();

  timerRAF = setTimeout(nextQuestion, 3500);
}

function showFinal() {
  phase = "final";
  gameEl.style.display = "none";
  boardEl.style.display = "block";
  boardTitle.textContent = "🏆 Final Leaderboard";
  renderBoard();
  const ranked = Object.entries(players).sort((a,b) => b[1].score - a[1].score);
  ranked.forEach(([id, p], i) => {
    send({ type: "to-controller", playerId: id, data: { kind: "final", rank: i+1, total: ranked.length, score: p.score } });
  });
}

function renderBoard() {
  const ranked = Object.entries(players).sort((a,b) => b[1].score - a[1].score);
  rowsEl.innerHTML = "";
  ranked.forEach(([id, p], i) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span class="rank">#${i+1}</span><span class="name">${escapeHtml(p.name)}</span><span class="score">${p.score}</span>`;
    rowsEl.appendChild(row);
  });
}
</script>
</body>
</html>
