<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Trivia — Play</title>
<style>
  :root {
    --glass-bg: rgba(255,255,255,0.10);
    --glass-bg-strong: rgba(255,255,255,0.18);
    --glass-border: rgba(255,255,255,0.35);
    --glass-highlight: rgba(255,255,255,0.55);
    --text: #f5f7ff;
    --muted: rgba(245,247,255,0.65);
    --accent: #7ee8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, #1b1035 0%, #0e1230 45%, #04070f 100%);
    position: relative;
  }
  .blob { position: fixed; border-radius: 50%; filter: blur(50px); opacity: 0.5; z-index: 0; }
  .blob1 { width: 300px; height: 300px; background: #ff5d9e; top: -80px; left: -60px; animation: float1 20s ease-in-out infinite; }
  .blob2 { width: 260px; height: 260px; background: #4da6ff; bottom: -80px; right: -60px; animation: float2 24s ease-in-out infinite; }
  @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,30px); } }
  @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px,-30px); } }

  .glass {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: 0 8px 28px rgba(0,0,0,0.35), inset 0 1px 0 var(--glass-highlight);
    position: relative;
    overflow: hidden;
  }
  .glass::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 40%;
    background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0));
    pointer-events: none;
  }

  .screen { position: relative; z-index: 1; height: 100%; display: none; }

  /* ---------- JOIN ---------- */
  #join {
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; position: relative; z-index: 1;
  }
  #join h2 { font-size: 22px; }
  #join input {
    background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: var(--text);
    font-size: 22px; text-align: center; letter-spacing: 6px;
    padding: 14px; border-radius: 14px; width: 200px;
    backdrop-filter: blur(10px);
  }
  #nameInput { letter-spacing: normal; font-size: 18px; width: 220px; }
  #join button {
    background: linear-gradient(135deg, var(--accent), #a6ffcb); color: #061019; border: none;
    padding: 14px 32px; font-size: 18px; font-weight: 700; border-radius: 14px;
  }
  #status { color: var(--muted); font-size: 14px; min-height: 20px; }

  /* ---------- WAITING ---------- */
  #waiting { flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; }
  #waiting .pulse { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; margin-bottom: 8px; }
  @keyframes pulse { 0%,100% { opacity: 0.4; transform: scale(1);} 50% { opacity: 1; transform: scale(1.4);} }

  /* ---------- QUESTION ---------- */
  #question { flex-direction: column; padding: 16px; gap: 12px; }
  #qHeader { text-align: center; padding: 14px; }
  #qHeaderText { font-size: 15px; color: var(--muted); }
  #qTimer { font-size: 13px; margin-top: 4px; }
  #answers { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; }
  .ans {
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 20px; font-weight: 700; padding: 10px; border: none;
  }
  .ans.a0 { background: linear-gradient(135deg, rgba(255,93,122,0.55), rgba(255,93,122,0.25)); border: 1px solid rgba(255,93,122,0.6); }
  .ans.a1 { background: linear-gradient(135deg, rgba(77,166,255,0.55), rgba(77,166,255,0.25)); border: 1px solid rgba(77,166,255,0.6); }
  .ans.a2 { background: linear-gradient(135deg, rgba(255,209,102,0.55), rgba(255,209,102,0.25)); border: 1px solid rgba(255,209,102,0.6); }
  .ans.a3 { background: linear-gradient(135deg, rgba(126,232,138,0.55), rgba(126,232,138,0.25)); border: 1px solid rgba(126,232,138,0.6); }
  .ans:active { transform: scale(0.96); }
  .ans.locked { opacity: 0.35; }
  .ans.chosen { outline: 3px solid #fff; }

  /* ---------- REVEAL ---------- */
  #reveal { flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; }
  #revealIcon { font-size: 56px; }
  #revealText { font-size: 22px; font-weight: 700; }
  #revealSub { color: var(--muted); font-size: 15px; }
  #revealScore { margin-top: 12px; font-size: 15px; }

  /* ---------- FINAL ---------- */
  #final { flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center; }
  #finalRank { font-size: 40px; font-weight: 800; color: var(--accent); }

  /* ---------- CHAT DRAWER ---------- */
  #chatToggle {
    position: fixed; top: 14px; right: 14px; z-index: 5; width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 20px; border: none; cursor: pointer;
  }
  #chatDrawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 82%; max-width: 320px;
    z-index: 6; transform: translateX(100%); transition: transform 0.25s ease;
    display: flex; flex-direction: column; padding: 16px; border-radius: 0;
  }
  #chatDrawer.open { transform: translateX(0); }
  #chatFeed { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
  .chat-msg { background: rgba(255,255,255,0.08); border-radius: 10px; padding: 6px 10px; font-size: 13px; }
  .chat-msg b { color: var(--accent); }
  #chatInputRow { display: flex; gap: 8px; }
  #chatInput {
    flex: 1; background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: var(--text);
    padding: 10px 12px; border-radius: 12px; font-size: 14px;
  }
  #chatSend { background: var(--accent); border: none; border-radius: 12px; padding: 0 16px; font-weight: 700; color: #061019; }
  #closeChatBtn { align-self: flex-end; background: none; border: none; color: var(--muted); font-size: 20px; }
</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>

<button id="chatToggle" class="glass">💬</button>
<div id="chatDrawer" class="glass">
  <button id="closeChatBtn">✕</button>
  <div id="chatFeed"></div>
  <div id="chatInputRow">
    <input id="chatInput" placeholder="Say something…" maxlength="120" />
    <button id="chatSend">Send</button>
  </div>
</div>

<div id="join" class="screen" style="display:flex;">
  <h2>🎉 Join Trivia</h2>
  <input id="codeInput" inputmode="numeric" maxlength="4" placeholder="0000" />
  <input id="nameInput" placeholder="Your name" maxlength="24" />
  <button id="joinBtn">Join</button>
  <div id="status"></div>
</div>

<div id="waiting" class="screen glass">
  <div class="pulse"></div>
  <h2 id="waitTitle">You're in!</h2>
  <div class="muted" style="color:var(--muted)">Waiting for host to start…</div>
</div>

<div id="question" class="screen">
  <div class="glass" id="qHeader">
    <div id="qHeaderText">Question 1/10</div>
    <div id="qTimer">⏱ 15s</div>
  </div>
  <div id="answers">
    <button class="ans a0 glass" data-i="0"></button>
    <button class="ans a1 glass" data-i="1"></button>
    <button class="ans a2 glass" data-i="2"></button>
    <button class="ans a3 glass" data-i="3"></button>
  </div>
</div>

<div id="reveal" class="screen glass">
  <div id="revealIcon">✅</div>
  <div id="revealText">Correct!</div>
  <div id="revealSub"></div>
  <div id="revealScore"></div>
</div>

<div id="final" class="screen glass">
  <div class="muted" style="color:var(--muted)">Final Rank</div>
  <div id="finalRank">#1</div>
  <div id="finalScore" class="muted" style="color:var(--muted)"></div>
</div>

<script>
const wsProtocol = location.protocol === "https:" ? "wss" : "ws";
const ws = new WebSocket(`${wsProtocol}://${location.host}`);
const el = (id) => document.getElementById(id);

const screens = ["join","waiting","question","reveal","final"];
function show(name) {
  screens.forEach((s) => el(s).style.display = (s === name) ? "flex" : "none");
}

const codeInput = el("codeInput"), nameInput = el("nameInput"), statusEl = el("status");
const urlCode = new URLSearchParams(location.search).get("code");
if (urlCode) codeInput.value = urlCode;

let joined = false;
let myName = "";
let locked = false;

ws.addEventListener("message", (event) => {
  const msg = JSON.parse(event.data);
  if (msg.type === "joined") {
    joined = true;
    show("waiting");
  } else if (msg.type === "join-error") {
    statusEl.textContent = msg.message;
  } else if (msg.type === "room-closed") {
    alert("Host disconnected.");
    location.reload();
  } else if (msg.type === "message") {
    handleGameMessage(msg.data);
  }
});

el("joinBtn").addEventListener("click", () => {
  const code = codeInput.value.trim();
  myName = nameInput.value.trim() || "Player";
  if (code.length !== 4) { statusEl.textContent = "Enter the 4-digit code shown on screen"; return; }
  ws.send(JSON.stringify({ type: "join-room", code, name: myName }));
});

function handleGameMessage(data) {
  if (data.kind === "chat") {
    addChatLine(data.from === myName ? `${data.from} (you)` : data.from, data.text);
  } else if (data.kind === "question") {
    locked = false;
    el("qHeaderText").textContent = `Question ${data.index+1} / ${data.total}`;
    document.querySelectorAll(".ans").forEach((btn, i) => {
      btn.textContent = data.options[i];
      btn.classList.remove("locked","chosen");
    });
    startTimer(data.duration);
    show("question");
  } else if (data.kind === "reveal") {
    el("revealIcon").textContent = data.correct ? "✅" : "❌";
    el("revealText").textContent = data.correct ? `Correct! +${data.earned}` : "Not quite";
    el("revealSub").textContent = data.correct ? "" : `Answer: ${data.correctText}`;
    el("revealScore").textContent = `Total score: ${data.totalScore}`;
    show("reveal");
  } else if (data.kind === "final") {
    el("finalRank").textContent = "#" + data.rank;
    el("finalScore").textContent = `${data.score} points · ${data.total} players`;
    show("final");
  } else if (data.kind === "reset") {
    show("waiting");
  }
}

let timerInterval = null;
function startTimer(durationMs) {
  clearInterval(timerInterval);
  let remaining = Math.ceil(durationMs / 1000);
  el("qTimer").textContent = `⏱ ${remaining}s`;
  timerInterval = setInterval(() => {
    remaining--;
    el("qTimer").textContent = `⏱ ${Math.max(remaining,0)}s`;
    if (remaining <= 0) clearInterval(timerInterval);
  }, 1000);
}

document.querySelectorAll(".ans").forEach((btn) => {
  btn.addEventListener("click", () => {
    if (locked || !joined) return;
    locked = true;
    const i = Number(btn.dataset.i);
    document.querySelectorAll(".ans").forEach((b) => b.classList.add("locked"));
    btn.classList.add("chosen");
    ws.send(JSON.stringify({ type: "input", data: { kind: "answer", choice: i } }));
  });
});

// --- Chat drawer ---
const chatDrawer = el("chatDrawer"), chatToggle = el("chatToggle"), chatFeed = el("chatFeed");
chatToggle.addEventListener("click", () => chatDrawer.classList.toggle("open"));
el("closeChatBtn").addEventListener("click", () => chatDrawer.classList.remove("open"));

function addChatLine(name, text) {
  const line = document.createElement("div");
  line.className = "chat-msg";
  line.innerHTML = `<b>${escapeHtml(name)}:</b> ${escapeHtml(text)}`;
  chatFeed.appendChild(line);
  chatFeed.scrollTop = chatFeed.scrollHeight;
}
function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

el("chatSend").addEventListener("click", sendChat);
el("chatInput").addEventListener("keydown", (e) => { if (e.key === "Enter") sendChat(); });
function sendChat() {
  const input = el("chatInput");
  const text = input.value.trim();
  if (!text || !joined) return;
  ws.send(JSON.stringify({ type: "input", data: { kind: "chat", text } }));
  input.value = "";
}
</script>
</body>
</html>
